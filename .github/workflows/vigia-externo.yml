name: Vigia externo

# Quem vigia o vigia (#85): uma vez por dia, de FORA do servidor, confere o /api/healthz e a validade
# do certificado de cada ambiente. Se algo estiver errado, o job falha e o GitHub manda e-mail para
# quem acompanha o repositório (os mantenedores). Grátis e sem conta nova. O uptime de 5 em 5 min é
# do monitor externo (docs/OPERACAO.md, "Vigia"); este é o reforço diário, e pega também o caso de o
# vigia.sh do servidor ter parado de rodar junto com o resto.
#
# Os endereços NÃO ficam no repositório (público): vêm do segredo VIGIA_URLS (origens separadas por
# espaço, ex.: https://staging.exemplo https://exemplo). Cada host é mascarado no log, que também é
# público. Sem o segredo, o job avisa e termina sem falhar.

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília, longe da hora cheia (fila do Actions)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigia:
    name: Healthz e certificado, de fora
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confere cada ambiente
        env:
          VIGIA_URLS: ${{ secrets.VIGIA_URLS }}
          CERT_DIAS: "15"
        run: |
          set -uo pipefail
          if [ -z "$VIGIA_URLS" ]; then
            echo "::notice::VIGIA_URLS não está configurado (passo do Felipe em docs/OPERACAO.md); nada a conferir."
            exit 0
          fi
          falhou=0; n=0
          for origem in $VIGIA_URLS; do
            n=$((n + 1))
            host=${origem#https://}; host=${host%%/*}
            echo "::add-mask::$origem"; echo "::add-mask::$host"
            # healthz: 200 e "status":"ok", com tempo máximo, de fora (o caminho que o usuário faz)
            corpo=$(curl -sS --max-time 15 -w '\n%{http_code}' "$origem/api/healthz" 2>&1) || corpo=$'\n000'
            codigo=${corpo##*$'\n'}
            if [ "$codigo" = 200 ] && printf '%s' "$corpo" | grep -q '"status":"ok"'; then
              echo "ambiente $n: healthz ok"
            else
              echo "::error::ambiente $n: healthz respondeu $codigo"; falhou=1
            fi
            if openssl s_client -connect "$host:443" -servername "$host" < /dev/null 2> /dev/null \
                 | openssl x509 -noout -checkend $((CERT_DIAS * 86400)) > /dev/null 2>&1; then
              echo "ambiente $n: certificado vale por mais de $CERT_DIAS dias"
            else
              echo "::error::ambiente $n: certificado vence em menos de $CERT_DIAS dias (ou não foi lido)"; falhou=1
            fi
          done
          exit "$falhou"
