name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions fixadas por SHA completo (com a versão no comentário); o Dependabot
# atualiza SHA e comentário juntos. Checkout sem credencial persistida (#60).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails (segredos e dados proibidos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Varredura de segredos (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Campos pessoais proibidos
        run: ./scripts/check-forbidden-fields.sh
      # Os testes de deploy/ existiam sem nunca rodar no CI: teste que ninguém
      # executa não é teste. Rodam aqui porque não dependem de npm nem de
      # banco -- só de bash, com dublês no lugar de age, docker e rclone.
      - name: Testes dos scripts de deploy
        run: |
          for t in deploy/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  app:
    name: App (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: detect
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run check
      - if: steps.detect.outputs.present != 'true'
        run: echo "Sem package.json ainda (scaffold pendente no M0)."

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Só o Chromium, com as dependências de sistema (projeto único no playwright.config.ts).
      - run: npx playwright install --with-deps chromium
      # O webServer do Playwright roda `next build` + `next start` (build de produção).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Os mesmos specs do job acima, agora com o Supabase local de pé (#21): os casos "com o
  # Supabase local" (login pelo link mágico, perfil, casa, contato, meus dados, exclusão e o
  # fluxo completo do cadastro) deixam de rodar só na máquina de quem desenvolve. Os que
  # precisam do Auth fora do ar ficam no job acima.
  e2e-live:
    name: E2E com banco (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Mesma porta do `site_url` do supabase/config.toml: o link do e-mail volta para o app.
      E2E_PORT: 3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with: { version: 3.2.0 }
      # Em segundo plano, enquanto o npm e o navegador instalam. Fica de fora só o que nenhum
      # spec usa; o Mailpit fica (os specs leem o link mágico nele). Migrations + seed na subida.
      - name: Sobe o Supabase local (em segundo plano)
        run: |
          nohup bash -c 'supabase start -x studio,imgproxy,edge-runtime,logflare,vector; echo $? > "$RUNNER_TEMP/supabase-start.exit"' \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Espera o Supabase e passa as chaves locais só para os testes
        run: |
          for _ in $(seq 1 120); do
            [ -f "$RUNNER_TEMP/supabase-start.exit" ] && break
            sleep 5
          done
          # O log só aparece na falha: no sucesso, ele traz as chaves do stack.
          if [ "$(cat "$RUNNER_TEMP/supabase-start.exit" 2>/dev/null)" != 0 ]; then
            cat "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          # Chaves do stack descartável deste job (geradas pela CLI na subida, nada no
          # repositório). A de serviço vai só para o processo de teste: o playwright.config.ts
          # a tira do ambiente do app (R6).
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          rm "$RUNNER_TEMP/supabase.env"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "E2E_LIVE_SUPABASE_URL=$API_URL"
            echo "E2E_LIVE_ANON_KEY=$ANON_KEY"
            echo "E2E_LIVE_SERVICE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_LIVE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAILPIT_URL=$MAILPIT_URL"
            echo "E2E_LIVE_DB_CONTAINER=$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n1)"
          } >> "$GITHUB_ENV"
      # Build de produção pelo webServer do Playwright; chaves de criptografia de teste
      # aleatórias a cada execução e chaves de teste públicas do Turnstile (playwright.config.ts).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-live
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Staging de mentira (#319): os jobs acima provam o código no ambiente de desenvolvimento
  # (supabase start, seed, docker run); este prova a MONTAGEM do servidor -- banco só com migrations
  # pelo migra.sh, app pelo compose do deploy, passos de operador pelos scripts de deploy/ e o
  # caminho inteiro no navegador (scripts/staging-ci.sh). As três falhas do staging de 2026-11-28
  # passaram por todos os outros jobs. Cada caso da matriz além do primeiro REVERTE um conserto e
  # só fica verde se o staging falhar na etapa e pelo motivo daquele dia: é o teste do teste.
  staging:
    name: Staging de mentira (${{ matrix.reverter && format('revertido {0}', matrix.reverter) || 'montagem do servidor' }})
    # ARM64, igual ao servidor: os digests do compose do deploy são os da plataforma dele.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        reverter: ["", termo, questionnaire-path, pgcrypto]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # Em segundo plano, enquanto o npm e o navegador instalam.
      - name: Constrói a imagem do app (em segundo plano)
        run: |
          nohup bash -c 'docker build --build-arg GIT_SHA="$GITHUB_SHA" -t complexo42:staging .; echo $? > "$RUNNER_TEMP/build.exit"' \
            > "$RUNNER_TEMP/build.log" 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Espera a imagem
        run: |
          for _ in $(seq 1 120); do
            [ -f "$RUNNER_TEMP/build.exit" ] && break
            sleep 5
          done
          if [ "$(cat "$RUNNER_TEMP/build.exit" 2>/dev/null)" != 0 ]; then
            tail -50 "$RUNNER_TEMP/build.log"; exit 1
          fi
      - name: Monta o staging e percorre o caminho inteiro
        env:
          STAGING_IMAGEM: complexo42:staging
          REVERTER: ${{ matrix.reverter }}
        run: scripts/staging-ci.sh ${REVERTER:+--reverter "$REVERTER"}
      - if: failure() && matrix.reverter == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-staging
          path: test-results/
          retention-days: 7

  # npm audit das dependências de PRODUÇÃO (#153). Reprova só crítico ou alto com correção
  # disponível (scripts/audit-gate.mjs); o resto vai para o resumo. Exceção: uma por advisory em
  # security/npm-audit-exceptions.json, com motivo e data de revisão. Sem `npm ci`: o audit lê o lock.
  dependencies:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: npm audit --omit=dev
        run: |
          set -o pipefail
          # O audit sai != 0 quando acha qualquer coisa; quem decide é o portão, que também reprova
          # se o relatório vier com erro (sem rede não é "limpo").
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/audit.json" security/npm-audit-exceptions.json | tee -a "$GITHUB_STEP_SUMMARY"

  # Semgrep (#153), SÓ EM RELATÓRIO até a triagem do ruído inicial: não reprova o build. Regras
  # p/typescript e p/nextjs do registro público, sem conta e sem métricas. Imagem fixada por digest.
  # Supressão, quando houver, é na linha (`nosemgrep: <regra>` com o motivo), nunca a regra inteira.
  semgrep:
    name: Código (Semgrep, relatório)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Semgrep p/typescript + p/nextjs
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed \
            semgrep scan --config p/typescript --config p/nextjs --metrics=off --disable-version-check \
              --json --output semgrep.json --quiet
          set -o pipefail
          python3 - <<'RESUMO' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          saida = json.load(open("semgrep.json"))
          achados, varridos = saida["results"], saida["paths"]["scanned"]
          # Zero arquivos varridos não é "zero achados": é não ter medido. Isso reprova.
          if not varridos:
              raise SystemExit("ERRO: o Semgrep não varreu nenhum arquivo")
          print(f"### Semgrep (relatório, não reprova): {len(achados)} achado(s) em {len(varridos)} arquivo(s)")
          if achados:
              print("| regra | severidade | arquivo:linha |\n|---|---|---|")
              for r in achados:
                  print(f"| {r['check_id'].split('.')[-1]} | {r['extra']['severity']} | {r['path']}:{r['start']['line']} |")
          RESUMO

  database:
    name: Banco (migrations + testes de RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: detect
        run: echo "present=$([ -d supabase ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        # Mesma versão da devDependency `supabase` no package.json.
        with: { version: 3.2.0 }
      - if: steps.detect.outputs.present == 'true'
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - if: steps.detect.outputs.present == 'true'
        run: supabase test db
      - if: steps.detect.outputs.present != 'true'
        run: echo "Sem pasta supabase/ ainda (pendente no M0)."

  image:
    name: Imagem Docker (sem .env, não-root, healthz)
    # ARM64 nativo, igual ao servidor (ADR 0009 §3). Só testa: publicar é a #81.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t complexo42:ci .
      - run: ./scripts/check-image.sh complexo42:ci
      # Trivy na imagem (#153). Binário oficial com versão e SHA256 FIXOS, conferidos antes de rodar,
      # como o gitleaks acima: sem action de terceiro (a trivy-action teve tags trocadas em 2026; um SHA
      # de action protege a action, não o binário que ela baixa). Reprova SÓ crítico ou alto com
      # correção (scripts/trivy-gate.py); o relatório completo de alto/crítico vai para o resumo do job,
      # com quantos alvos e pacotes foram varridos -- varredura vazia reprova.
      # Exceção: security/trivyignore.yaml, uma por CVE, com motivo e data de validade.
      - name: Trivy (vulnerabilidades da imagem)
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3 # Linux-ARM64
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          bash scripts/check-trivyignore.test.sh
          python3 scripts/check-trivyignore.py security/trivyignore.yaml
          "$RUNNER_TEMP/trivy" image --quiet --ignorefile security/trivyignore.yaml --severity HIGH,CRITICAL \
            --list-all-pkgs --format json --output "$RUNNER_TEMP/trivy.json" complexo42:ci
          bash scripts/trivy-gate.test.sh
          python3 scripts/trivy-gate.py "$RUNNER_TEMP/trivy.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # As migrations viajam na imagem (#81) e o .dockerignore exclui `supabase`:
      # sem este passo, uma mudanca nele quebraria o deploy calada, porque o
      # build continua passando -- so o passo de migrations do deploy falharia.
      - name: As migrations estao na imagem, e so elas
        run: |
          na_imagem=$(docker run --rm --entrypoint ls complexo42:ci /app/supabase/migrations | grep -c '\.sql$')
          no_repo=$(ls -1 supabase/migrations/*.sql | wc -l | tr -d ' ')
          echo "na imagem: $na_imagem | no repositorio: $no_repo"
          [ "$na_imagem" = "$no_repo" ] || { echo "ERRO: a imagem nao leva todas as migrations"; exit 1; }
          # seed, testes e config.toml continuam FORA: sao de desenvolvimento.
          if docker run --rm --entrypoint ls complexo42:ci /app/supabase/config.toml > /dev/null 2>&1; then
            echo "ERRO: config.toml vazou para a imagem"; exit 1
          fi
      # A infra que o deploy sincroniza (ADR 0015) tambem viaja na imagem, e os
      # SCRIPTS de deploy nao podem viajar junto: rodam no host, como root.
      - name: A infra está na imagem, e SÓ ela
        run: |
          # A lista fica no deploy.sh (allowlist): a imagem e fonte de
          # CONTEUDO, nao de caminho. Aqui o CI confere o outro lado -- que a
          # imagem nao traga NADA alem dela. O .dockerignore e lista de
          # EXCLUSAO, entao arquivo novo em deploy/ entra por omissao: sem este
          # passo, um `*.key` ou um `staging.env` viajaria na imagem, e o
          # deploy recusaria a sincronia so em producao.
          #
          # As listas sao LIDAS do deploy.sh, nao repetidas aqui: duas copias de
          # uma lista divergem, e a divergencia apareceria no deploy, nao no CI.
          #
          # SAO DUAS, e precisam das duas: INFRA_PERMITIDA e o que o deploy
          # SINCRONIZA no servidor; SO_LEITURA_NA_IMAGEM e o que ele apenas LE da
          # imagem e descarta (a lista de obrigatorias). Conferir so a primeira
          # reprovaria a imagem legitima; conferir nenhuma deixaria um `*.key`
          # viajar junto.
          lista_do_deploy() { # lista_do_deploy <NOME_DO_ARRAY>
            sed -n "/^$1=(/,/^)/p" deploy/deploy.sh \
              | sed '1d;$d' | sed 's/#.*//' | tr -d ' \t' | grep -v '^$'
          }
          esperado=$( { lista_do_deploy INFRA_PERMITIDA; lista_do_deploy SO_LEITURA_NA_IMAGEM; } \
            | LC_ALL=C sort -u)
          na_imagem=$(docker run --rm --entrypoint sh complexo42:ci \
            -c 'cd /app/deploy && find . ! -type d | sed "s|^\./||"' | LC_ALL=C sort)
          # Sem isto o passo passaria com a lista VAZIA: um `sed` que deixe de
          # casar (alguem renomeia a variavel, muda a indentacao) faria
          # "esperado" e "na_imagem" ficarem os dois vazios, e o passo viraria
          # decoração. Não fixo o número 4 aqui de propósito -- seria uma
          # segunda cópia da lista para manter, e é o teste do deploy.sh que
          # garante QUAIS são os arquivos; aqui só se confere que a leitura
          # funcionou e produziu caminhos plausíveis.
          [ -n "$esperado" ] || { echo "ERRO: nao consegui ler INFRA_PERMITIDA do deploy.sh"; exit 1; }
          echo "$esperado" | grep -qvE '^[A-Za-z0-9][A-Za-z0-9._/-]*$' \
            && { echo "ERRO: a lista lida do deploy.sh tem linha que nao e caminho:"; echo "$esperado"; exit 1; }
          echo "entradas lidas do deploy.sh: $(echo "$esperado" | wc -l | tr -d ' ')"
          echo "--- esperado ---"; echo "$esperado"
          echo "--- na imagem ---"; echo "$na_imagem"
          if [ "$esperado" != "$na_imagem" ]; then
            echo "ERRO: /app/deploy nao e exatamente a lista do deploy.sh"
            diff <(echo "$esperado") <(echo "$na_imagem") || true
            exit 1
          fi
          echo "ok: a imagem traz exatamente a infra da lista"
      # A allowlist diz QUAIS arquivos o root grava; nao diz o que tem DENTRO
      # deles. O compose do Supabase roda como root no host, entao `privileged`,
      # o socket do Docker ou um monte de `/` sao caminho direto para fora do
      # container -- risco residual registrado na ADR 0015. Este grep nao
      # substitui a revisao do PR; pega a regressao obvia.
      - name: O compose do Supabase não pede privilégio no host
        run: |
          padrao='privileged|/var/run/docker\.sock|^[[:space:]]*-[[:space:]]*/:|cap_add|pid:[[:space:]]*host|network_mode:[[:space:]]*host'
          if grep -nEi "$padrao" deploy/docker-compose.supabase.yml; then
            echo "ERRO: o compose do Supabase pede privilegio no host -- revise na mao"
            exit 1
          fi
          echo "ok: nenhum pedido de privilegio no compose do Supabase"

      # Toda variavel obrigatoria em producao tem de ser repassada pelo compose
      # do app. Em 2026-11-28 o login do staging recusou todo mundo com
      # `missing_key`: FIELD_ENCRYPTION_KEY e BLIND_INDEX_KEY estavam no
      # secrets/env, com valor, e o `environment:` do compose nao as listava.
      # O gen-secrets as gerava e o env.example as documentava -- tres lugares
      # concordando e um discordando, em silencio. O container sobe sem elas e
      # falha no PRIMEIRO USO de cifra, que e justamente o login.
      - name: Toda variável obrigatória em produção chega ao container
        run: |
          bash scripts/check-env-compose.test.sh
          python3 scripts/check-env-compose.py

      # Todo plugin usado no kong.yml tem de estar em KONG_PLUGINS. A lista do
      # compose e RESTRITIVA (o padrao do Kong e `bundled`, com dezenas), e o
      # Kong RECUSA SUBIR se o declarativo usar um plugin fora dela -- derruba
      # o /auth/v1 inteiro, login junto. Aconteceu no staging em 2026-11-27,
      # ~4 minutos de 502, com o `request-termination` do #247.
      #
      # Precisa entender o YAML: `- name:` aparece tambem em servicos e rotas,
      # entao casar texto daria falso positivo. Aqui so entram os nomes que
      # estao DENTRO de um bloco `plugins:`.
      - name: Todo plugin do kong.yml está habilitado em KONG_PLUGINS
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          compose = open("deploy/docker-compose.supabase.yml").read()
          m = re.search(r"^[ \t]*KONG_PLUGINS:[ \t]*(.+)$", compose, re.M)
          if not m:
              sys.exit("ERRO: nao achei KONG_PLUGINS no compose")
          habilitados = {p.strip() for p in m.group(1).strip().strip('"\'').split(",") if p.strip()}

          kong = yaml.safe_load(open("deploy/kong.yml"))
          usados = set()
          def colhe(no):
              if isinstance(no, dict):
                  for nome, valor in no.items():
                      if nome == "plugins" and isinstance(valor, list):
                          for pl in valor:
                              if isinstance(pl, dict) and pl.get("name"):
                                  usados.add(pl["name"])
                      else:
                          colhe(valor)
              elif isinstance(no, list):
                  for item in no:
                      colhe(item)
          colhe(kong)

          print("habilitados:", ", ".join(sorted(habilitados)))
          print("usados no kong.yml:", ", ".join(sorted(usados)) or "(nenhum)")
          faltando = sorted(usados - habilitados)
          if faltando:
              print("ERRO: usados no kong.yml e AUSENTES de KONG_PLUGINS:", ", ".join(faltando))
              print("      o Kong recusaria subir e o /auth/v1 cairia inteiro.")
              sys.exit(1)
          print("ok: todos os plugins usados estao habilitados")
          PY

      # O link do e-mail do GoTrue e API_EXTERNAL_URL.ResolveReference(path),
      # com `path` vindo dos MAILER_URLPATHS_*. Como o default `/verify` e
      # ABSOLUTO, ele descarta o caminho da base: sem os quatro explicitos, o
      # e-mail aponta para o app e o login inteiro para. E NENHUM teste pega --
      # o link so e montado com o GoTrue de verdade enviando e-mail. Por isso a
      # trava mora aqui. A versao anterior desta trava checava a coisa errada
      # (e chegou a PROIBIR os MAILER_URLPATHS_*, que sao o conserto); custou um
      # deploy e um teste de ponta a ponta em 2026-11-27 descobrir.
      - name: O link de e-mail do GoTrue aponta para o Auth, não para o app
        run: |
          arq=deploy/docker-compose.supabase.yml
          falhou=

          # A base serve ao callback do OAuth (concatenacao de string em
          # internal/api/external.go), nao ao e-mail.
          base=$(grep -nE '^[[:space:]]*API_EXTERNAL_URL:[[:space:]]*\$\{SITE_URL[^}]*\}/auth/v1[[:space:]]*$' "$arq" || true)
          if [ -z "$base" ]; then
            echo "ERRO: esperava API_EXTERNAL_URL: \${SITE_URL...}/auth/v1 (callback do OAuth). Achei:"
            grep -nE '^[[:space:]]*API_EXTERNAL_URL:' "$arq" || echo "  (a linha nao existe)"
            falhou=1
          else
            echo "ok: $base"
          fi

          # Os quatro caminhos do e-mail. O magic link reusa o de RECOVERY, e
          # deixar um de fora quebra um fluxo so, em silencio.
          for chave in INVITE CONFIRMATION RECOVERY EMAIL_CHANGE; do
            linha=$(grep -nE "^[[:space:]]*GOTRUE_MAILER_URLPATHS_$chave:[[:space:]]*/auth/v1/verify[[:space:]]*\$" "$arq" || true)
            if [ -z "$linha" ]; then
              echo "ERRO: GOTRUE_MAILER_URLPATHS_$chave precisa ser /auth/v1/verify. Achei:"
              grep -nE "^[[:space:]]*GOTRUE_MAILER_URLPATHS_$chave:" "$arq" || echo "  (a linha nao existe)"
              falhou=1
            else
              echo "ok: $linha"
            fi
          done

          [ -z "$falhou" ] || exit 1

      # Senha opcional (ADR 0018). Mesma tecnica da trava acima: chave ancorada no comeco da
      # linha, para um comentario que cite a chave nao enganar. Sem estas chaves o GoTrue cai nos
      # padroes (minimo de 8, sem checagem de senha vazada, troca de senha sem reautenticar), e
      # nenhum teste de unidade percebe: o GoTrue de verdade so roda no servidor.
      - name: A senha do GoTrue tem a política e as travas do ADR 0018
        run: |
          arq=deploy/docker-compose.supabase.yml
          falhou=
          for par in \
            GOTRUE_PASSWORD_MIN_LENGTH:12 \
            GOTRUE_PASSWORD_HIBP_ENABLED:true \
            GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION:true \
            GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_CURRENT_PASSWORD:true; do
            chave=${par%%:*}; valor=${par##*:}
            if grep -qE "^[[:space:]]*$chave:[[:space:]]*\"?$valor\"?[[:space:]]*(#.*)?\$" "$arq"; then
              echo "ok: $chave = $valor"
            else
              echo "ERRO: $chave precisa ser $valor. Achei:"
              grep -nE "^[[:space:]]*$chave:" "$arq" || echo "  (a linha nao existe)"
              falhou=1
            fi
          done
          # Nao exigir simbolos nem maiusculas (ADR 0018 §2).
          if grep -qE '^[[:space:]]*GOTRUE_PASSWORD_REQUIRED_CHARACTERS:' "$arq"; then
            echo "ERRO: GOTRUE_PASSWORD_REQUIRED_CHARACTERS nao deve existir (a politica nao exige simbolos)."
            falhou=1
          fi
          # A rota /auth/v1/signup tem o PROPRIO request-termination 404 (no mesmo servico), nao
          # qualquer 404 do arquivo; e os endpoints sensiveis so respondem ao app (sem X-Forwarded-For).
          bloco() { awk -v p="$1" '/^  - name: /{if(f)exit; b=""} {b=b $0 "\n"} $0 ~ "^[[:space:]]*-[[:space:]]+" p "[[:space:]]*$" {f=1} END{if(f)printf "%s", b}' deploy/kong.yml; }
          for caminho in /auth/v1/signup /auth/v1/token /auth/v1/recover /auth/v1/otp /auth/v1/user; do
            if bloco "$caminho" | grep -qE '^[[:space:]]*-[[:space:]]*name:[[:space:]]*request-termination[[:space:]]*$' \
               && bloco "$caminho" | grep -qE '^[[:space:]]*status_code:[[:space:]]*404[[:space:]]*$'; then
              echo "ok: $caminho tem request-termination 404 no proprio servico"
            else
              echo "ERRO: $caminho precisa do request-termination 404 no servico que o declara (deploy/kong.yml)."
              falhou=1
            fi
          done
          for caminho in /auth/v1/token /auth/v1/recover /auth/v1/otp /auth/v1/user; do
            bloco "$caminho" | grep -qE '^[[:space:]]*x-forwarded-for:' || { echo "ERRO: $caminho precisa casar o cabecalho x-forwarded-for."; falhou=1; }
          done
          [ -z "$falhou" ] || exit 1

      # Mede o kong.yml com o Kong de verdade: de fora (com X-Forwarded-For) o login por senha e
      # os demais endpoints sensiveis dao 404; a chamada interna do app passa (ADR 0018 §3).
      - name: O Kong só deixa o app usar o login por senha e a recuperação
        run: bash deploy/kong.test.sh

      # O GoTrue CAI EM SILENCIO no template padrao (em ingles) quando a URL do
      # template nao responde, ou quando a variavel some: o login continua
      # funcionando e ninguem percebe. Esta trava exige as 10 chaves (templates e
      # assuntos), ancoradas no comeco da linha para nao contar comentario. Quem
      # confere que a rota responde e que o assunto e o da config sao os testes
      # (tests/gotrue-email-templates.test.ts) e o smoke da OPERACAO.md.
      - name: O compose do Supabase define templates e assuntos de e-mail do GoTrue
        run: |
          falta=0
          for chave in MAGIC_LINK CONFIRMATION RECOVERY INVITE EMAIL_CHANGE; do
            for grupo in TEMPLATES SUBJECTS; do
              if ! grep -qE "^[[:space:]]*GOTRUE_MAILER_${grupo}_${chave}:[[:space:]]*[^[:space:]#]" deploy/docker-compose.supabase.yml; then
                echo "ERRO: falta GOTRUE_MAILER_${grupo}_${chave} no compose do Supabase"
                falta=1
              fi
            done
          done
          if [ "$falta" -ne 0 ]; then
            echo "Sem elas o GoTrue manda o e-mail em ingles, em silencio."
            exit 1
          fi
          echo "ok: 5 templates e 5 assuntos de e-mail definidos"
      # Credencial e host de provedor social sao o lugar classico onde alguem
      # "resolve rapido" colando o valor no compose. Aqui as quatro chaves do
      # Google tem que ser REFERENCIA a variavel, nunca literal, e o redirect
      # tem que sair do SITE_URL -- e o mesmo valor cadastrado no Google Cloud.
      # Os tres de sessao sao travados no valor, porque mudar qualquer um deles
      # muda a seguranca do login e merece passar por revisao, nao por descuido.
      - name: Google e sessão vêm da configuração, com os valores revisados
        run: |
          arq=deploy/docker-compose.supabase.yml
          falhou=
          exige() { # exige <chave> <regex-do-valor> <explicacao>
            if grep -qE "^[[:space:]]*$1:[[:space:]]*$2[[:space:]]*\$" "$arq"; then
              echo "ok: $1"
            else
              echo "ERRO: $1 -- esperava $3. Achei:"
              grep -nE "^[[:space:]]*$1:" "$arq" || echo "  (a linha nao existe)"
              falhou=1
            fi
          }
          exige GOTRUE_EXTERNAL_GOOGLE_ENABLED     '\$\{GOOGLE_ENABLED:-false\}'       'vir de GOOGLE_ENABLED, desligado por padrao'
          exige GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID   '\$\{GOOGLE_CLIENT_ID:-\}'          'ser referencia a GOOGLE_CLIENT_ID, nunca literal'
          exige GOTRUE_EXTERNAL_GOOGLE_SECRET      '\$\{GOOGLE_CLIENT_SECRET:-\}'      'ser referencia a GOOGLE_CLIENT_SECRET, nunca literal'
          exige GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI '\$\{SITE_URL[^}]*\}/auth/v1/callback' 'sair do SITE_URL e terminar em /auth/v1/callback'
          exige GOTRUE_JWT_EXP                     '"3600"'                            'ficar em 3600 -- sessao longa vem do refresh, nao do token de acesso'
          exige GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED '"true"'                 'ser true'
          exige GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL   '"10"'                   'ser 10 -- zero derruba sessao com duas abas renovando'
          exige GOTRUE_SESSIONS_TIMEBOX            '720h'                              'ser 720h (30 dias)'

          # Nenhuma dessas chaves pode ter sido definida por engano junto.
          for k in GOTRUE_SESSIONS_INACTIVITY_TIMEOUT GOTRUE_SESSIONS_SINGLE_PER_USER; do
            if grep -nE "^[[:space:]]*$k:" "$arq"; then
              echo "ERRO: $k foi definido -- decisao deliberada era NAO definir; leve a revisao"
              falhou=1
            fi
          done

          [ -z "$falhou" ] || exit 1
