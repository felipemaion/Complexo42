# Supabase auto-hospedado MÍNIMO — referência (ADR 0009 §1, issue #79)
#
# Este arquivo é referência: cada ambiente roda a sua cópia, com o seu
# próprio arquivo de segredos, fora do repositório. O servidor é ARM64,
# então todas as imagens estão fixadas por tag + digest linux/arm64.
#
# Serviços: db, auth (GoTrue), rest (PostgREST) e kong. Realtime, Storage,
# Functions e Analytics ficam de fora de propósito (RAM e superfície).
# studio e meta só sobem com `--profile admin` e NUNCA são publicados.
#
# Rede: db, auth e rest ficam em `interna`, sem rota para fora. Só o kong
# entra também em `proxy`, que é como o proxy reverso alcança os apps.
# Quem decide o que o mundo vê é o proxy reverso, não o kong.

# O nome do projeto NAO e fixo aqui de proposito: staging e producao rodam no
# MESMO host. Com `name:` fixo, os dois ambientes dividiriam nomes de container
# e de volume, e o segundo `up` sequestraria o primeiro. O nome vem do
# COMPOSE_PROJECT_NAME do arquivo de segredos (ex.: complexo42stg).

x-comum: &comum
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *comum
    image: supabase/postgres:17.12.0.001@sha256:2543d8fb3889ff2ee514af39496f67c30edd1f1e0da923a560e7930d2f59ca16
    # ATENCAO: sobrescrever `command` descarta os argumentos da imagem, e com
    # eles a configuracao dela. Sem `listen_addresses=*` o Postgres sobe
    # escutando SO em localhost: o healthcheck (que roda dentro do container)
    # passa, e auth e rest levam "connection refused". Medido em 2026-11-19.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
    environment:
      # UMA SENHA POR PAPEL (#95). O `db` recebe as tres porque e ele quem cria
      # os papeis no initdb (02-roles.sh). Os outros servicos recebem SO a sua:
      # assim, vazar o ambiente do rest ou do auth nao da superusuario.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?obrigatorio}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?obrigatorio}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?obrigatorio}
      POSTGRES_DB: postgres
    volumes:
      - db-dados:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # O healthcheck precisa testar o que os dependentes usam: TCP, senha e
      # consulta. Duas versoes anteriores mentiram aqui:
      #  - `pg_isready -U postgres` responde "aceitando conexoes" sem validar
      #    o papel, e deu healthy num banco onde o papel nem existia;
      #  - `psql -U ... ` sem host usa o SOCKET UNIX, que responde durante a
      #    fase de initdb, quando o servidor ainda NAO escuta em TCP. O auth e
      #    o rest subiam e morriam com "connection refused".
      # Com -h 127.0.0.1 o teste passa pelo mesmo caminho que eles.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U supabase_admin -d postgres -c 'select 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    cpus: 0.50
    networks: [interna]

  auth:
    <<: *comum
    image: supabase/gotrue:v2.198.0@sha256:952105b3aa2831bc246270d6701687373f594cc7526f2566db599d82dfaf9d07
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD:?obrigatorio}@db:5432/postgres
      # Sem API_EXTERNAL_URL o GoTrue morre no boot: "required key
      # API_EXTERNAL_URL missing value". A chave NAO tem o prefixo GOTRUE_.
      #
      # O SUFIXO /auth/v1 NAO E ENFEITE. O GoTrue monta o link do e-mail como
      # API_EXTERNAL_URL + MAILER_URLPATHS_CONFIRMATION (default `/verify`), e o
      # endpoint vive atras do proxy sob /auth/v1. Com a raiz do site aqui, o
      # e-mail sai apontando para {site}/verify, que cai no APP em vez do Auth:
      # o middleware trata como pagina protegida, redireciona para o login
      # LEVANDO O TOKEN NA QUERY STRING, e o token nunca e consumido.
      # Medido no staging em 2026-11-27, com o mesmo token invalido nos dois:
      #   /verify          -> 307 /entrar?next=%2Fverify%3Ftoken%3D...
      #   /auth/v1/verify  -> 303 #error=access_denied&error_code=otp_expired
      # O segundo e o endpoint certo respondendo certo. Vale igual para o
      # /callback do OAuth, que o GoTrue monta da mesma base.
      #
      # Se um dia for preciso mexer nos MAILER_URLPATHS_*, lembrar que eles sao
      # CONCATENADOS a esta base: com /auth/v1 aqui, o caminho continua
      # `/verify`. Poe-los como `/auth/v1/verify` daria /auth/v1/auth/v1/verify.
      API_EXTERNAL_URL: ${SITE_URL:?obrigatorio}/auth/v1
      GOTRUE_SITE_URL: ${SITE_URL:?obrigatorio}
      GOTRUE_URI_ALLOW_LIST: ${URI_ALLOW_LIST:?obrigatorio}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?obrigatorio}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # Cadastro aberto só depois de #87 e #26. Até lá, convite pelo gestor.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      # Porta 25 bloqueada no servidor: e-mail só por relay (ver OPERACAO.md).
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_LOG_LEVEL: info
      # Limites do login (#9; iguais ao supabase/config.toml). Ajustar o de
      # e-mail à cota do relay em #87.
      # O IP do cliente vem do cabeçalho que a Cloudflare grava na borda (o app
      # o repassa nos pedidos que faz pelo servidor). Sem isso, todo pedido
      # pareceria vir do proxy ou do app, e o limite por IP seria global.
      GOTRUE_RATE_LIMIT_HEADER: CF-Connecting-IP
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "30"   # e-mails por hora, no Auth todo
      GOTRUE_RATE_LIMIT_OTP: "30"          # pedidos de login por IP / 5 min
      GOTRUE_RATE_LIMIT_VERIFY: "30"       # conferências de link por IP / 5 min
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_SMTP_MAX_FREQUENCY: 60s       # intervalo mínimo por endereço
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 192m
    cpus: 0.25
    networks: [interna]

  rest:
    <<: *comum
    image: postgrest/postgrest:v16.6@sha256:c20c387ea5e89134f987c833ffa66459dd506e2e9102c8c5fb688d881a8acd45
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?obrigatorio}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: error
      # Servidor de administracao do PostgREST: expoe /live e /ready para quem
      # checa de FORA do container (ver OPERACAO.md). Nao e publicado.
      PGRST_ADMIN_SERVER_PORT: "3001"
    # SEM healthcheck, de proposito. A imagem do PostgREST nao tem shell nem
    # wget/curl -- `docker run --entrypoint sh` nela nem executa --, entao
    # qualquer teste CMD-SHELL falha para sempre e o container fica eternamente
    # unhealthy MESMO COM O SERVICO NO AR (medido em 2026-11-19: o log dizia
    # "Schema cache loaded" enquanto o compose o marcava unhealthy e barrava o
    # kong). A prontidao se verifica de fora, pelo /ready da porta 3001.
    mem_limit: 192m
    cpus: 0.25
    networks: [interna]

  kong:
    <<: *comum
    image: kong:3.9.4@sha256:dd41dedd859a459617f595ef7c5ea7607dd7fd9252a0cc9de13b43f770360c8c
    depends_on:
      auth: { condition: service_healthy }
      # service_started, nao service_healthy: o rest nao tem healthcheck (acima).
      rest: { condition: service_started }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PLUGINS: request-transformer,cors,key-auth
      KONG_LOG_LEVEL: notice
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    cpus: 0.25
    networks:
      interna:
      # Alias POR AMBIENTE na rede compartilhada: sem isso, staging e producao
      # teriam ambos o nome `kong` nela, e o proxy reverso cairia em round-robin
      # entre os dois ambientes. E este alias que o proxy usa como destino.
      proxy:
        aliases:
          - ${KONG_ALIAS:?obrigatorio}

  # ─── perfil admin: NUNCA publicado, acesso só por túnel SSH ───
  # studio e meta seguem com a senha do supabase_admin de proposito: a funcao
  # deles e administrar o banco. Mitigacao: perfil `admin`, so sobem sob demanda
  # e so por tunel SSH (ver OPERACAO.md). Nao ficam no ar como rest e auth.
  studio:
    <<: *comum
    profiles: ["admin"]
    image: supabase/studio:2026.11.16-sha-51bd16d@sha256:5d6f359e2d4d93a56e3d13ac2c753b60f6d02a49ffaf2d1196ab0077c19a4f42
    depends_on:
      meta: { condition: service_healthy }
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:?}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
    mem_limit: 512m
    cpus: 0.25
    networks: [interna]

  meta:
    <<: *comum
    profiles: ["admin"]
    image: supabase/postgres-meta:v0.100.1@sha256:e94dc6bcf67649b8549244ab1f04b64028108fb63c5c207c27cc033e668dd686
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 192m
    cpus: 0.25
    networks: [interna]

volumes:
  db-dados:

networks:
  interna:
  proxy:
    external: true
