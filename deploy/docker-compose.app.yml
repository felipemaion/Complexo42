# App Next.js — referência (ADR 0009 §1 e §3, issue #80)
#
# Como o compose do Supabase, é referência: cada ambiente roda a sua cópia e o
# deploy de produção vive no repositório de infraestrutura. Sobe DEPOIS do
# docker-compose.supabase.yml do mesmo ambiente e entra na rede interna dele.
# Use um COMPOSE_PROJECT_NAME PRÓPRIO para o app (ex.: <ambiente>-app): com o
# mesmo nome do Supabase, um `up --remove-orphans` derrubaria o banco.
#
# Sem `ports:`: só o proxy reverso alcança o app, pela rede `proxy`.

services:
  app:
    # Referência COMPLETA (#161): `ghcr.io/...:sha-abc` ou
    # `ghcr.io/...@sha256:...`. Antes era `:${APP_TAG}`, que não comporta
    # digest -- e digest é o que identifica a imagem que o build conferiu.
    image: ${APP_IMAGEM:?obrigatorio}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      # Prontidão do banco: admin do PostgREST na rede interna (nunca publicado).
      DB_HEALTH_URL: http://rest:3001/ready
      HEALTH_TIMEOUT_MS: "2000"
      # Login (#9, ADR 0009 §1): o app fala com o Auth pela rede interna (kong);
      # o navegador só alcança o /auth/v1 publicado na origem do site. A chave é
      # a ANON_KEY do mesmo ambiente; NUNCA a SERVICE_ROLE_KEY (R6; o app recusa).
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SITE_URL:?obrigatorio}
      SUPABASE_ANON_KEY: ${ANON_KEY:?obrigatorio}
      SITE_URL: ${SITE_URL:?obrigatorio}
      # Repassar o CF-Connecting-IP ao Auth (rate limit por IP). Ligar SÓ se o
      # servidor garante que apenas a Cloudflare alcança a origem (#86); senão
      # qualquer um forja o cabeçalho. Desligado por padrão.
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      # Cloudflare Turnstile no pedido do link por e-mail (#116). Chaves do
      # widget DESTE ambiente, criadas no painel da Cloudflare (docs/OPERACAO.md).
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?obrigatorio}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?obrigatorio}
      # Cifra de campo (ADR 0003). SEM ELAS O LOGIN NÃO FUNCIONA: a checagem de
      # acesso cifra/decifra, e sem chave o app responde `missing_key` -- o
      # processo sobe saudável e recusa toda entrada. Foi o que aconteceu no
      # staging em 2026-11-28: as chaves estavam no `secrets/env`, com valor, e
      # este bloco não as listava. `:?` para o compose recusar subir sem elas,
      # como já faz com a ANON_KEY; a guarda do CI confere o par
      # (env.ts obrigatórias) x (este bloco).
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?obrigatorio}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?obrigatorio}
      # Rotação de chave (ADR 0003 §5): vazio é o normal. Precisam estar aqui
      # para a rotação não exigir editar o compose no meio da operação.
      FIELD_ENCRYPTION_KEY_VERSION: ${FIELD_ENCRYPTION_KEY_VERSION:-}
      FIELD_ENCRYPTION_PREVIOUS_KEYS: ${FIELD_ENCRYPTION_PREVIOUS_KEYS:-}
      # Assinatura do resultado do questionário (ADR 0014). Vazio é tolerado
      # aqui -- o app trata vazio como ausente -- porque ela ainda NÃO está no
      # secrets/env do staging (conferido em 2026-11-28); sem ela o
      # questionário falha ao gravar, mas o resto do app funciona. Por isso não
      # entrou nas obrigatórias: derrubaria o ambiente inteiro em vez de uma
      # tela. Gerar e instalar a chave é ação do dono do servidor.
      QUESTIONNAIRE_SIGNING_KEY: ${QUESTIONNAIRE_SIGNING_KEY:-}
      # Questionário real das casas (#313): caminho DENTRO do container do arquivo instalado em
      # ./questionario (montado abaixo). `:?` porque sem ele o app serviria em silêncio o exemplo
      # fictício, com a chave de exemplo; em produção o app também se recusa a subir sem ele.
      QUESTIONNAIRE_PATH: ${QUESTIONNAIRE_PATH:?obrigatorio}
      # CSP (#152): "1" só avisa no console do navegador, para a estreia no
      # staging; vazio (padrão) bloqueia. Não deixe "1" em produção (docs/OPERACAO.md).
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-}
    # Sistema de arquivos só leitura; gravável apenas /tmp (memória) e os logs.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      # Sobrevive à recriação do container. O diretório do host precisa ser do
      # uid 1000 (usuário `node` da imagem); sem permissão, o app loga só no stdout.
      - ./data/logs:/app/data/logs
      # O questionário real (JSON da pasta privada), só leitura. `QUESTIONNAIRE_PATH` aponta para o
      # arquivo dentro desta pasta (ex.: /app/questionario/questionnaire.json).
      - ./questionario:/app/questionario:ro
    mem_limit: 384m
    cpus: 0.50
    networks:
      interna:
      # Alias POR AMBIENTE, pelo mesmo motivo do KONG_ALIAS: staging e produção
      # dividem a rede `proxy`, e o proxy reverso usa este nome como destino.
      proxy:
        aliases:
          - ${APP_ALIAS:?obrigatorio}

networks:
  # Rede interna criada pelo compose do Supabase deste ambiente
  # (<projeto-do-supabase>_interna). É nela que o nome `rest` resolve.
  interna:
    external: true
    name: ${SUPABASE_NETWORK:?obrigatorio}
  proxy:
    external: true
