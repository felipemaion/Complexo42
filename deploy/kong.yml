# Kong declarativo (sem banco). Só duas rotas existem.
#
# IMPORTANTE — quem é o portão: o proxy reverso do servidor publica
# SOMENTE /auth/v1/*. A rota /rest/v1 existe aqui porque o app a consome
# pela rede interna (ADR 0009 §1), e de fora ela responde 404 pelo proxy.
# Consequência conhecida: dentro da rede compartilhada do servidor, o kong
# é alcançável. Por isso a RLS continua sendo a barreira real, não o kong.
_format_version: "3.0"

services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth-v1
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest-v1
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
